info:
  name: List connection requests
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/connection-requests?direction={{direction}}&status={{requestStatus}}"
  params:
    - name: direction
      value: "{{direction}}"
      type: query
    - name: status
      value: "{{requestStatus}}"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

docs: Lists connection requests, optionally filtered by direction and status.

