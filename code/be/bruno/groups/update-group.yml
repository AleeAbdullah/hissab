info:
  name: Update group
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/v1/groups/{{groupId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "name": "Updated trip"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

docs: Updates a group name. Any active member may perform this mutation.
