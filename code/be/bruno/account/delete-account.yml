info:
  name: Delete account
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/account/deletion"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "confirmation": "DELETE"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

docs: Irreversibly anonymizes an eligible account and immediately revokes every session.
