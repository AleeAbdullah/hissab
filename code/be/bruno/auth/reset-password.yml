info:
  name: Reset password
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/password/reset"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "token": "{{resetToken}}",
        "newPassword": "{{newPassword}}"
      }
docs: Uses a password-reset token to change the password and revoke existing sessions.
