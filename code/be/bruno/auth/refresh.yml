info:
  name: Refresh tokens
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/refresh"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("accessToken", res.body.accessToken);
          bru.setVar("refreshToken", res.body.refreshToken);
          bru.setVar("sessionId", res.body.sessionId);
        }

docs: Rotates the refresh token and captures the new token pair and session ID.
