info:
  name: Change password
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/v1/auth/password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "{{newPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

docs: Changes the authenticated user's password and revokes existing sessions.

