info:
  name: Forgot password
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/password/forgot"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
docs: Requests a password-reset event without revealing whether the account exists.
