info:
  name: Create settlement
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/ledgers/{{ledgerId}}/settlements"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
        "fromUserId": "{{fromUserId}}",
        "toUserId": "{{toUserId}}",
        "amountMinor": "{{amountMinor}}",
        "occurredAt": "{{occurredAt}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

docs: Records an external payment between two active ledger members; Hissab does not move money.
