info:
  name: Get personal report
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/v1/personal/reports?includeShared=true&bucket=MONTH"
  auth:
    type: bearer
    token: "{{accessToken}}"

docs: Returns manual and shared-allocation totals grouped by UTC day or month; settlements are excluded.
