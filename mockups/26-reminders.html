  <h1>Reminder review and result<span class="sid">S05 · S06</span></h1>
  <p class="note">A reminder is a notification with no message field, on purpose: without one there is nothing to escalate. The screen shows exactly what the recipient will see, and the rate limit is stated before the tap rather than after it.</p>
</header>
<main class="board">
