<title>06 · Find and add connection — hissab</title>

<body>
<header class="sheet-head">
  <div class="crumb"><a href="00-index.html">← All screens</a></div>
  <h1>Find and add connection<span class="sid">F02</span></h1>
  <p class="note">Exact-email lookup only. Raw user IDs are never shown and there is no directory or suggestion list, so the screen cannot be used to enumerate accounts.</p>
  <span class="prov">Provisional — search-by-identifier data contract is not settled</span>
</header>
<main class="board">
<figure class="fr "><figcaption><b>Before search</b> States the rule up front rather than after a failed query.</figcaption><div class="phone brand friends"><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="act">Cancel</span></div><div class="mid"><div class="ttl">Add connection</div></div><div class="trail"><span class="act off semi">Send</span></div></div><div class="scroll"><div class="search"><svg viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5"/><path d="M10.6 10.6 15 15"/></svg><span class="t-body">Email address</span></div><p class="t-cap c-sec" style="margin:4px 20px">Search by the exact email address on their account. hissab does not list or suggest people you have no connection with.</p><div class="empty"><div class="gl"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></div><h3>Search for someone</h3><p>You need the email address they signed up with.</p></div></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Already connected</b> The result is shown but not selectable, so the user learns why instead of sending a request that would fail.</figcaption><div class="phone brand friends"><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="act">Cancel</span></div><div class="mid"><div class="ttl">Add connection</div></div><div class="trail"><span class="act off semi">Send</span></div></div><div class="scroll"><div class="search"><svg viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5"/><path d="M10.6 10.6 15 15"/></svg><span class="q t-body">priya.nair@example.com</span></div><div class="seclabel t-caps first">Result</div><div class="card list "><div class="row"><span class="avatar a3 ">PN</span><span class="grow"><span class="t-body med">Priya Nair</span><span class="t-cap c-sec" style="display:block">Already connected · Flat 3B</span></span><span class="badge b-pos">Connected</span></div></div></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Selectable result</b> Says exactly what the other person will see before the request is sent.</figcaption><div class="phone brand friends"><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="act">Cancel</span></div><div class="mid"><div class="ttl">Add connection</div></div><div class="trail"><span class="act semi">Send</span></div></div><div class="scroll"><div class="search"><svg viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5"/><path d="M10.6 10.6 15 15"/></svg><span class="q t-body">omar.f@example.com</span></div><div class="seclabel t-caps first">Result</div><div class="card list "><div class="row"><span class="avatar a4 ">OF</span><span class="grow"><span class="t-body med">Omar Farooq</span><span class="t-cap c-sec" style="display:block">Not connected</span></span><span class="tick on"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" class="r"/><path d="M6 11.4 9.6 15 16 7.8" class="k"/></svg></span></div></div><p class="t-cap c-sec" style="margin:12px 20px">Omar will see your display name and be able to accept or decline. Nothing is shared until they accept.</p></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>No result</b> Non-enumerating: the wording never confirms whether the email exists.</figcaption><div class="phone brand friends"><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="act">Cancel</span></div><div class="mid"><div class="ttl">Add connection</div></div><div class="trail"><span class="act off semi">Send</span></div></div><div class="scroll"><div class="search"><svg viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5"/><path d="M10.6 10.6 15 15"/></svg><span class="q t-body">nobody@example.com</span></div><div class="empty"><div class="gl"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></div><h3>No account for that email</h3><p>Check the spelling, or ask them to create an account first. We cannot confirm whether an email is registered.</p><div class="btn" style="margin:0 8px">Try another email</div></div></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Sent</b> Names where the pending request now lives and that it can be cancelled.</figcaption><div class="phone brand friends"><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="act">Cancel</span></div><div class="mid"><div class="ttl">Add connection</div></div><div class="trail"><span class="act off semi">Send</span></div></div><div class="scroll"><div class="success"><div class="mark"><svg viewBox="0 0 24 24"><path d="M3 12.5 9 18.5 21 5.5"/></svg></div><div class="t-headline">Request sent</div><p class="t-supp c-sec" style="margin:8px 0 0">Omar Farooq will appear under Connection requests until they respond. You can cancel it from there.</p></div><div class="brand-actions stack"><div class="btn sec">Done</div></div></div><div class="homebar"></div></div></figure>
</main>
