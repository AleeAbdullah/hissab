  <h1>Ledger and category pickers<span class="sid">E02 · E07</span></h1>
  <p class="note">Two selection sheets share one shape: search, a shortlist of likely answers, then the full list. Each states the consequence of the choice before it is made — a direct expense is private, and income categories are not offered.</p>
</header>
<main class="board">
