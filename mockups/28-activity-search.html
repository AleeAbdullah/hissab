  <h1>Activity filters<span class="sid">Y02</span></h1>
  <p class="note">Area and ledger filters are visible as chips above the results rather than hidden behind an icon, so the reason a result set is small is always on screen. Results stay chronological.</p>
</header>
<main class="board">
<figure class="fr "><figcaption><b>Filters</b> Area and ledger as two independent lists, with the resulting count on the action before it is applied.</figcaption><div class="phone brand activity"><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Activity</span></span></div><div class="mid"><div class="ttl">Filter activity</div></div><div class="trail"></div></div><div style="display:flex;gap:8px;padding:4px 16px 8px;flex-wrap:wrap"><span class="badge b-brand">Shared activity ✕</span><span class="badge b-brand">Winter Trip ✕</span><span class="badge">Social activity</span></div><div class="scroll"><div class="seclabel t-caps first">Filter by area</div><div class="card list "><div class="row "><span class="badge b-brand">On</span><span class="grow lbl t-body">Shared activity</span><span class="val"><span class="t-body c-sec">Included</span></span></div><div class="row "><span class="grow lbl t-body">Social activity</span><span class="val"></span></div></div><div class="seclabel t-caps">Filter by ledger</div><div class="card list "><div class="row "><span class="badge b-brand">On</span><span class="grow lbl t-body">Winter Trip</span><span class="val"><span class="t-body c-sec">Included</span></span></div><div class="row "><span class="grow lbl t-body">Flat 3B</span><span class="val"></span></div><div class="row "><span class="grow lbl t-body">John Doe</span><span class="val"></span></div></div></div><div class="footer"><div style="display:flex;gap:8px"><span class="btn out" style="flex:1">Clear all</span><span class="btn" style="flex:1">Show 12 results</span></div></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Results</b> Chips stay pinned above the results, and the ordering rule is stated.</figcaption><div class="phone brand activity"><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Activity</span></span></div><div class="mid"><div class="ttl">Filter activity</div></div><div class="trail"></div></div><div style="display:flex;gap:8px;padding:4px 16px 8px;flex-wrap:wrap"><span class="badge b-brand">Shared activity ✕</span><span class="badge b-brand">Winter Trip ✕</span><span class="badge">Social activity</span></div><div class="scroll"><div class="seclabel t-caps first">12 results · newest first</div><div class="card list "><div class="row erow"><span class="avatar a6 ">AR</span><span class="grow"><span class="ti t-body"><b class="med">You</b> edited an expense</span><span class="me t-cap">Winter Trip · Ski passes</span></span><span class="val"><span class="mn t-body mono ">$900.00</span><span class="sb t-cap">Today 9:03 AM</span></span><span class="chev"><svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></span></div><div class="row erow"><span class="avatar a2 ">JD</span><span class="grow"><span class="ti t-body"><b class="med">John Doe</b> added an expense</span><span class="me t-cap">Winter Trip · Ski passes</span></span><span class="val"><span class="mn t-body mono ">$720.00</span><span class="sb t-cap">Jul 28</span></span><span class="chev"><svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></span></div><div class="row erow"><span class="avatar a6 ">AR</span><span class="grow"><span class="ti t-body"><b class="med">You</b> changed the split</span><span class="me t-cap">Winter Trip · Ski passes</span></span><span class="val"><span class="sb t-cap">Jul 28</span></span><span class="chev"><svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></span></div></div><p class="t-cap c-sec" style="margin:12px 20px">Results stay in date order. Sorting by relevance would hide when something happened, which is the one thing an audit trail must preserve.</p></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>No results</b> Says which filter is responsible and offers to remove exactly that one, rather than a generic 'try again'.</figcaption><div class="phone brand activity"><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Activity</span></span></div><div class="mid"><div class="ttl">Filter activity</div></div><div class="trail"></div></div><div style="display:flex;gap:8px;padding:4px 16px 8px;flex-wrap:wrap"><span class="badge b-brand">Shared activity ✕</span><span class="badge b-brand">Winter Trip ✕</span><span class="badge">Social activity</span></div><div class="scroll"><div class="empty"><div class="gl"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></div><h3>No activity with these filters</h3><p>Winter Trip has no shared activity in the selected area. Clearing the ledger filter will show activity elsewhere.</p><div class="btn" style="margin:0 8px">Clear ledger filter</div></div></div><div class="homebar"></div></div></figure>
