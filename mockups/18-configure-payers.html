  <h1>Configure payers<span class="sid">E03</span></h1>
  <p class="note">Every amount row is labelled <b>Paid</b>. The word is printed on the row rather than implied by which sheet you opened, because Paid and Owes are the two numbers in this product that must never be confusable. The running line compares against the total in words.</p>
</header>
<main class="board">
