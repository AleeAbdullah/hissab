  <h1>Receipt source and upload<span class="sid">E08 · E09</span></h1>
  <p class="note">The permission is requested at the moment it is needed and the sheet says who will be able to see the image. Every failure path here is careful to separate the receipt from the money: a failed upload never puts the expense itself in doubt.</p>
</header>
<main class="board">

<figure class="fr "><figcaption><b>Permission denied</b> Offers the alternative instead of a dead end, and states that the receipt is optional.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="mid"><div class="ttl">Receipt</div></div><div class="trail"></div></div><div class="scroll"><div class="banner w"><span class="ic">!</span><span class="bt t-supp"><span class="h">Camera access is off</span>hissab asks for the camera only when you attach a receipt. You can still choose an existing photo, or save the expense without one.</span><span class="ba t-supp">Settings</span></div><div style="padding:0 16px"><div class="thumb"><span class="t-supp">No preview</span></div></div><div style="display:flex;gap:8px;padding:16px"><span class="btn out" style="flex:1">Choose from library</span></div><p class="t-cap c-sec" style="margin:0 20px">A receipt is optional. Nothing about the expense depends on it.</p></div><div class="footer"><div class="btn sec">Continue without a receipt</div></div><div class="homebar"></div></div></figure>
