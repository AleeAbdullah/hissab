<!doctype html>
<html lang="en" class="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · Password recovery — hissab</title>
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_frame.css">
</head>
<body>
<header class="sheet-head">
  <div class="crumb"><a href="00-index.html">← All screens</a></div>
  <h1>Password recovery<span class="sid">A05 · A06</span></h1>
  <p class="note">Four frames covering both surfaces of one flow. The confirmation is written to be true whether or not the account exists, which is why it says &ldquo;requested&rdquo; rather than &ldquo;sent&rdquo;.</p>
</header>
<main class="board">
<figure class="fr "><figcaption><b>Request reset</b> A05. One field, one action.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="mid"></div><div class="trail"></div></div>
<div class="scroll">
  <div style="padding:4px 16px 16px">
    <div class="t-large">Reset password</div>
    <div class="t-supp c-sec" style="margin-top:6px">Enter the email on your account and we will send a link to set a new password.</div>
  </div>
  <div class="card">
    <div class="field"><span class="flbl t-cap">Email</span>
      <div class="fval"><span class="t-body">alina@example.com</span><span class="caret"></span></div></div>
  </div>
  <div style="padding:0 16px"><div class="btn">Send reset instructions</div></div>
</div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Requested</b> A05 confirmation. Neutral by design, and states the expiry so the user knows the window.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="mid"></div><div class="trail"></div></div>
<div class="scroll">
  <div class="success">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 12.5 9 18.5 21 5.5"/></svg></div>
    <div class="t-headline">Instructions requested</div>
    <p class="t-supp c-sec" style="margin:8px 0 0">
      If an account exists for <span class="c-pri semi">alina@example.com</span>, a reset link is on
      its way. The link expires in 30 minutes.
    </p>
    <p class="t-cap c-sec" style="margin:16px 0 0">
      We do not confirm whether an email is registered.
    </p>
  </div>
  <div style="padding:8px 16px"><div class="btn sec">Back to sign in</div></div>
</div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Set new password</b> A06. Warns that all sessions end before the user commits, not after.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="mid"></div><div class="trail"></div></div>
<div class="scroll">
  <div style="padding:4px 16px 16px">
    <div class="t-large">Set new password</div>
    <div class="t-supp c-sec" style="margin-top:6px">Signing in again will be required on every device.</div>
  </div>
  <div class="card">
    <div class="field"><span class="flbl t-cap">New password</span>
      <div class="fval"><span class="t-body">••••••••••••</span></div>
      <span class="fhint t-cap">At least 10 characters, with one number.</span></div>
    <div class="field"><span class="flbl t-cap">Confirm new password</span>
      <div class="fval"><span class="t-body">••••••••••••</span><span class="caret"></span></div></div>
  </div>
  <div style="padding:0 16px"><div class="btn">Save new password</div></div>
</div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Expired link</b> A06 failure. Explains why rather than just refusing, and offers the recovery path.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="mid"></div><div class="trail"></div></div>
<div class="scroll">
  <div style="padding:4px 16px 16px"><div class="t-large">Link expired</div></div>
  <div class="banner e"><span class="ic">!</span><span class="bt t-supp">
    <span class="h">This reset link is no longer valid</span>
    Reset links expire 30 minutes after they are requested, and can only be used once.
  </span></div>
  <div style="padding:8px 16px">
    <div class="btn" style="margin-bottom:10px">Request a new link</div>
    <div class="btn sec">Back to sign in</div>
  </div>
</div><div class="homebar"></div></div></figure>
</main>
<button class="mode-btn" data-mode-toggle>Dark mode</button>
<script src="_app.js"></script>
</body>
</html>
