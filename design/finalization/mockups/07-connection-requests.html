  <h1>Connection requests<span class="sid">F03 · F04</span></h1>
  <p class="note">Incoming and outgoing in one screen, split by section rather than by tab — the counts are small and a segmented control would hide half the information behind a tap. Accept and Decline sit on the row they act on.</p>
</header>
<main class="board">
<figure class="fr "><figcaption><b>Pending</b> Actions are on the row, full-width enough to clear 44 pt. Outgoing gets Cancel only.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Friends</span></span></div><div class="mid"><div class="ttl">Connection requests</div></div><div class="trail"></div></div><div class="scroll"><div class="seclabel t-caps first">Incoming · 2</div><div class="card list "><div class="row top"><span class="avatar a6 ">MK</span><span class="grow"><span class="t-body med">Maya Khan</span><span class="t-cap c-sec" style="display:block;margin-top:1px">Sent 2 hours ago</span><div style="display:flex;gap:8px;margin-top:10px"><span class="btn sm">Accept</span><span class="btn sm out">Decline</span></div></span></div><div class="row top"><span class="avatar a8 ">TA</span><span class="grow"><span class="t-body med">Tariq Ahmed</span><span class="t-cap c-sec" style="display:block;margin-top:1px">Sent yesterday</span><div style="display:flex;gap:8px;margin-top:10px"><span class="btn sm">Accept</span><span class="btn sm out">Decline</span></div></span></div></div><div class="seclabel t-caps">Outgoing · 1</div><div class="card list "><div class="row "><span class="avatar a4 ">OF</span><span class="grow"><span class="t-body med">Omar Farooq</span><span class="t-cap c-sec" style="display:block;margin-top:1px">Sent 5 minutes ago</span></span><span class="btn sm out">Cancel</span></div></div></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Resolved</b> Terminal states stay visible briefly so the outcome is legible; the declined row is careful not to imply the other person was notified.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Friends</span></span></div><div class="mid"><div class="ttl">Connection requests</div></div><div class="trail"></div></div><div class="scroll"><div class="seclabel t-caps first">Incoming</div><div class="card list "><div class="row "><span class="avatar a6 ">MK</span><span class="grow"><span class="t-body med">Maya Khan</span><span class="t-cap c-sec" style="display:block;margin-top:1px">Accepted · you are now connected</span></span><span class="badge b-pos">Accepted</span></div><div class="row "><span class="avatar a8 ">TA</span><span class="grow"><span class="t-body med">Tariq Ahmed</span><span class="t-cap c-sec" style="display:block;margin-top:1px">Declined yesterday · they were not told who declined</span></span><span class="badge">Declined</span></div></div><div class="seclabel t-caps">Outgoing</div><div class="card list "><div class="row "><span class="avatar a4 ">OF</span><span class="grow"><span class="t-body med">Omar Farooq</span><span class="t-cap c-sec" style="display:block;margin-top:1px">You cancelled this request</span></span><span class="badge">Cancelled</span></div></div><p class="t-cap c-sec" style="margin:4px 20px">Resolved requests disappear after seven days.</p></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Empty</b> Reachable from the Friends row even when the count is zero.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Friends</span></span></div><div class="mid"><div class="ttl">Connection requests</div></div><div class="trail"></div></div><div class="scroll"><div class="empty"><div class="gl"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 19c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"/><circle cx="17.5" cy="9.5" r="2.4"/><path d="M16.4 14.4c2.9.2 4.3 2.1 4.3 5"/></svg></div><h3>No requests</h3><p>Incoming and outgoing connection requests appear here.</p><div class="btn" style="margin:0 8px">Add a connection</div></div></div><div class="homebar"></div></div></figure>
