  <h1>Group balances and simplified debts<span class="sid">G05 · G06</span></h1>
  <p class="note">Who-owes-whom, per currency, with Settle only on rows that involve you. Simplification is deliberately a separate read-only screen so it can never be mistaken for an action that rewrote the ledger.</p>
</header>
<main class="board">
<figure class="fr "><figcaption><b>Balances</b> Relationship sentences, not a matrix. Two currencies sit in two cards with no combined figure anywhere.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="mid"><div class="ttl">Balances</div><div class="sub">Winter Trip</div></div><div class="trail"></div></div><div class="scroll"><div class="seclabel t-caps first">US Dollar · USD</div><div class="card list "><div class="row"><span class="grow"><span class="t-body">You owe <b>John Doe</b></span></span><span class="val t-body semi mono c-neg" style="margin-right:8px">240.00</span><span class="btn sm out">Settle</span></div><div class="row"><span class="grow"><span class="t-body"><b>Maya Khan</b> owes you</span></span><span class="val t-body semi mono c-pos" style="margin-right:8px">30.00</span><span class="btn sm out">Settle</span></div><div class="row"><span class="grow"><span class="t-body"><b>Sam Kessler</b> owes you</span></span><span class="val t-body semi mono c-pos" style="margin-right:8px">15.00</span><span class="btn sm out">Settle</span></div></div><div class="seclabel t-caps">Pakistani Rupee · PKR</div><div class="card list "><div class="row"><span class="grow"><span class="t-body">You owe <b>Omar Farooq</b></span></span><span class="val t-body semi mono c-neg" style="margin-right:8px">12,500</span><span class="btn sm out">Settle</span></div></div><p class="t-cap c-sec" style="margin:4px 20px">Balances are shown per currency and are never added together. Only rows involving you offer Settle.</p><div class="card "><div class="row "><span class="grow lbl t-body">Simplify debts</span><span class="val"><span class="t-body c-sec">5 payments → 3</span></span><span class="chev"><svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></span></div></div></div><div class="homebar"></div></div></figure>
<figure class="fr "><figcaption><b>Simplified debts</b> The non-mutation promise is the first thing on the screen, not a footnote, and there is no Apply button to misread.</figcaption><div class="phone "><div class="statusbar"><span>9:41</span><span class="ind"><i></i><i class="b"></i></span></div><div class="nav "><div class="lead"><span class="back"><svg viewBox="0 0 10 18" width="10" height="18" style="display:block"><path d="M8 2 2.5 9 8 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Balances</span></span></div><div class="mid"><div class="ttl">Simplified debts</div><div class="sub">Winter Trip</div></div><div class="trail"></div></div><div class="scroll"><div class="banner "><span class="ic">i</span><span class="bt t-supp"><span class="h">Suggestions only</span>Nothing here has been applied. Your expenses, history and balances are unchanged.</span></div><div class="seclabel t-caps first">US Dollar · USD</div><div class="card list "><div class="row"><span class="grow"><span class="t-body"><b>You</b> pay <b>John Doe</b></span></span><span class="val t-body semi mono">210.00</span></div><div class="row"><span class="grow"><span class="t-body"><b>Maya Khan</b> pays <b>John Doe</b></span></span><span class="val t-body semi mono">15.00</span></div></div><div class="seclabel t-caps">Pakistani Rupee · PKR</div><div class="card list "><div class="row"><span class="grow"><span class="t-body"><b>You</b> pay <b>Omar Farooq</b></span></span><span class="val t-body semi mono">12,500</span></div></div><p class="t-cap c-sec" style="margin:4px 20px">Read-only. To act on a suggestion, record a settlement for it — hissab will not create payments for you.</p></div><div class="homebar"></div></div></figure>
